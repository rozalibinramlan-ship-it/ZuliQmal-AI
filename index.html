// ================== MENU ==================
function binaButangTahun() {
  var c = document.getElementById('tahunButtons');
  c.innerHTML = '';
  for (var i = 1; i <= 6; i++) {
    (function(n) {
      var btn = document.createElement('button');
      btn.className = 'tahun-btn' + (n === tahunSemasa ? ' active' : '');
      btn.textContent = '🎒 TAHUN ' + n;
      btn.onclick = function() { pilihTahun(n, btn); };
      c.appendChild(btn);
    })(i);
  }
}

function pilihTahun(tahun, el) {
  var bs = document.querySelectorAll('.tahun-btn');
  for (var i = 0; i < bs.length; i++) bs[i].classList.remove('active');
  el.classList.add('active');
  tahunSemasa = tahun;
  dataPelajar.tahunDipilih = tahun;
  simpanData();
  binaKotakSubjek(tahun);
}

function binaKotakSubjek(tahun) {
  var container = document.getElementById('kotakSubjek');
  var senarai = DATA['tahun' + tahun] || [];
  container.innerHTML = '';
  
  for (var i = 0; i < senarai.length; i++) {
    (function(s) {
      var a = document.createElement('div');
      a.className = 'subjek-kotak';
      a.style.borderColor = s.warna;
      var html = '';
      if (s.badge) html += '<span class="badge-baru">' + s.badge + '</span>';
      html += '<div class="emoji">' + s.emoji + '</div>';
      html += '<div class="nama" style="color:' + s.warna + '">' + s.nama + '</div>';
      html += '<div class="info">' + s.info + '</div>';
      a.innerHTML = html;
      a.onclick = function() { bukaSubjek(tahun, s.id); };
      container.appendChild(a);
    })(senarai[i]);
  }
}

// ================== TUKAR PAGE ==================
function bukaSubjek(tahun, id) {
  subjekSemasaId = id;
  tabSemasa = 'buku';
  sudahJawab = {};
  
  // Hide menu, show subjek
  document.getElementById('page-menu').classList.remove('active');
  document.getElementById('page-subjek').classList.add('active');
  
  // Setup header
  var subjek = NAMA_SUBJEK[id] || { nama: 'Subjek', emoji: '📚', info: '' };
  document.getElementById('badgeTahun').textContent = 'TAHUN ' + tahun;
  document.getElementById('namaSubjek').textContent = subjek.emoji + ' ' + subjek.nama;
  document.getElementById('infoSubjek').textContent = '📚 ' + subjek.info;
  document.title = subjek.nama + ' Tahun ' + tahun + ' - IQmal AI';
  
  // Reset tabs
  var tabs = document.querySelectorAll('.tab');
  for (var i = 0; i < tabs.length; i++) tabs[i].classList.remove('active');
  tabs[0].classList.add('active');
  
  // Bina topik
  var senaraiTopik = (TOPIK[id] && TOPIK[id][tahun]) || [];
  var topikContainer = document.getElementById('topikList');
  topikContainer.innerHTML = '';
  
  if (senaraiTopik.length === 0) {
    topikContainer.innerHTML = '<p style="color:#8ba3c7;font-size:13px;">Topik akan datang.</p>';
    document.getElementById('contentBox').innerHTML = '<div style="text-align:center;padding:40px;color:#8ba3c7;">📚 Topik untuk subjek ini belum disediakan.</div>';
    return;
  }
  
  for (var j = 0; j < senaraiTopik.length; j++) {
    (function(t, idx) {
      var btn = document.createElement('button');
      btn.className = 'topik-btn' + (idx === 0 ? ' active' : '');
      btn.textContent = t;
      btn.onclick = function() { pilihTopik(t, btn); };
      topikContainer.appendChild(btn);
    })(senaraiTopik[j], j);
  }
  
  topikSemasa = senaraiTopik[0];
  paparKandungan(tahun);
  
  window.scrollTo(0, 0);
}

function balikMenu() {
  document.getElementById('page-subjek').classList.remove('active');
  document.getElementById('page-menu').classList.add('active');
  document.title = '👑 IQmal AI — EDISI PREMIUM';
  window.scrollTo(0, 0);
}

function pilihTopik(topik, el) {
  var bs = document.querySelectorAll('.topik-btn');
  for (var i = 0; i < bs.length; i++) bs[i].classList.remove('active');
  el.classList.add('active');
  topikSemasa = topik;
  sudahJawab = {};
  paparKandungan(tahunSemasa);
}

function tukarTab(tab, el) {
  var ts = document.querySelectorAll('.tab');
  for (var i = 0; i < ts.length; i++) ts[i].classList.remove('active');
  el.classList.add('active');
  tabSemasa = tab;
  paparKandungan(tahunSemasa);
}

// ================== KANDUNGAN ==================
function paparKandungan(tahun) {
  var box = document.getElementById('contentBox');
  var key = subjekSemasaId + '_' + tahun + '_' + topikSemasa;
  
  if (tabSemasa === 'buku') {
    var nota = NOTA[key];
    if (nota) {
      box.innerHTML = '<div class="nota-content">' + nota + '</div>';
    } else {
      box.innerHTML = '<div class="nota-content"><h2>📚 ' + topikSemasa + '</h2><p>Nota untuk topik ini sedang disediakan.</p><div class="contoh">💡 Cikgu akan tambah nota tidak lama lagi!</div></div>';
    }
  }
  else if (tabSemasa === 'latihan') {
    var soalan = LATIHAN[key];
    if (soalan) paparLatihan(soalan);
    else box.innerHTML = '<div style="text-align:center;padding:40px;color:#8ba3c7;">✏️ Latihan untuk topik ini akan datang.</div>';
  }
  else if (tabSemasa === 'video') {
    paparVideo(tahun);
  }
}

function paparLatihan(soalan) {
  var box = document.getElementById('contentBox');
  var html = '<div style="text-align:center;color:#D4AF37;font-weight:bold;margin-bottom:15px;font-size:14px;">📝 ' + soalan.length + ' soalan • Tekan jawapan anda</div>';
  
  for (var i = 0; i < soalan.length; i++) {
    var s = soalan[i];
    html += '<div class="soalan-box" id="soalan-' + i + '">';
    html += '<div class="soalan-teks">' + (i+1) + '. ' + s.s + '</div>';
    var hurufList = ['A', 'B', 'C', 'D'];
    for (var k = 0; k < hurufList.length; k++) {
      var h = hurufList[k];
      html += '<div class="pilihan" onclick="jawab(' + i + ',\'' + h + '\')">';
      html += '<span class="huruf">' + h + '</span> ' + s[h];
      html += '</div>';
    }
    html += '<div class="feedback" id="fb-' + i + '"></div></div>';
  }
  box.innerHTML = html;
}

function jawab(noSoalan, huruf) {
  if (sudahJawab[noSoalan]) return;
  sudahJawab[noSoalan] = true;
  var key = subjekSemasaId + '_' + tahunSemasa + '_' + topikSemasa;
  var soalan = LATIHAN[key];
  if (!soalan) return;
  var data = soalan[noSoalan];
  var box = document.getElementById('soalan-' + noSoalan);
  var semuaPilihan = box.querySelectorAll('.pilihan');
  var fb = document.getElementById('fb-' + noSoalan);
  
  for (var i = 0; i < semuaPilihan.length; i++) {
    var p = semuaPilihan[i];
    p.style.pointerEvents = 'none';
    var h = p.querySelector('.huruf').textContent;
    if (h === data.j) p.classList.add('betul');
    else if (h === huruf && huruf !== data.j) p.classList.add('salah');
  }
  
  if (huruf === data.j) {
    fb.className = 'feedback ok show';
    fb.innerHTML = '✅ Betul! Hebat! 🎉';
  } else {
    fb.className = 'feedback no show';
    fb.innerHTML = '❌ Belum betul. Jawapan: ' + data.j + ' (' + data[data.j] + ')';
  }
}

function paparVideo(tahun) {
  var box = document.getElementById('contentBox');
  var namaTopik = topikSemasa.toLowerCase().replace(/ /g, '-').replace(/&/g, 'dan');
  var videoPath = 'video/' + subjekSemasaId + '/' + namaTopik + '.mp4';
  
  box.innerHTML = '<div class="info-video"><div class="ikon">🎬</div><h3>Video: ' + topikSemasa + '</h3><p>Video untuk topik ini belum dimuatkan.</p><p style="color:#D4AF37;font-weight:bold;margin-top:15px;font-family:monospace;font-size:11px;">' + videoPath + '</p><p style="margin-top:15px;font-size:12px;">📁 Letak fail video dalam folder:<br><b style="color:#D4AF37;">video/' + subjekSemasaId + '/</b></p></div>';
  
  var testVideo = document.createElement('video');
  testVideo.src = videoPath;
  testVideo.onloadedmetadata = function() {
    box.innerHTML = '<div style="background:#000;border-radius:15px;overflow:hidden;border:3px solid #D4AF37;margin-bottom:15px;"><video controls playsinline style="width:100%;display:block;max-height:400px;"><source src="' + videoPath + '" type="video/mp4"></video></div><p style="text-align:center;color:#D4AF37;font-weight:bold;">🎬 ' + topikSemasa + ' - Tahun ' + tahun + '</p>';
  };
}

// ================== TUKAR NAMA ==================
function tukarNama() {
  var namaBaru = prompt('Siapa nama anda?', dataPelajar.nama);
  if (namaBaru && namaBaru.trim()) {
    dataPelajar.nama = namaBaru.trim();
    simpanData();
    document.getElementById('namaPelajar').textContent = namaBaru.trim();
  }
}

// ================== PANGKAT ==================
function updatePangkat() {
  var b = dataPelajar.bintang;
  var pangkat, emoji, warna;
  if (b >= 100) { pangkat = 'DIAMOND'; emoji = '💎'; warna = 'linear-gradient(135deg,#00CED1,#1E90FF)'; }
  else if (b >= 50) { pangkat = 'GOLD'; emoji = '🥇'; warna = 'linear-gradient(135deg,#D4AF37,#B8860B)'; }
  else if (b >= 20) { pangkat = 'SILVER'; emoji = '🥈'; warna = 'linear-gradient(135deg,#C0C0C0,#A9A9A9)'; }
  else { pangkat = 'BRONZE'; emoji = '🥉'; warna = 'linear-gradient(135deg,#CD7F32,#8B4513)'; }
  var el = document.getElementById('pangkatVIP');
  if (el) {
    el.textContent = emoji + ' ' + pangkat + ' MEMBER';
    el.style.background = warna;
  }
}

// ================== INIT ==================
function init() {
  document.getElementById('namaPelajar').textContent = dataPelajar.nama;
  updatePangkat();
  binaButangTahun();
  binaKotakSubjek(tahunSemasa);
}

window.onload = init;
</script>

</body>
</html>
