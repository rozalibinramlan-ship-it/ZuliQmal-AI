function binaKotakSubjek(tahun) {

  container.innerHTML = '';
  for (var i = 0; i < senarai.length; i++) {
    (function(s) {

      a.className = 'subjek-kotak';
      a.style.borderColor = s.warna;
      var html = '';
      if (s.badge) html += '<span class="badge-baru">' + s.badge + '</span>';
      html += '<div class="emoji">' + s.emoji + '</div>';
      html += '<div class="nama" style="color:' + s.warna + '">' + s.nama + '</div>';
      html += '<div class="info">' + s.info + '</div>';
      a.innerHTML = html;
      a.onclick = function() { bukaSubjek(tahun, s.id); };
      container.appendChild(a);
    })(senarai[i]);
  }
}
