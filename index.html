// ==========================================
// BINA BUTANG TAHUN
// ==========================================
function binaButangTahun() {
  var container = document.getElementById('tahunButtons');
  container.innerHTML = '';
  
  for (var i = 1; i <= 6; i++) {
    (function(nombor) {
      var btn = document.createElement('button');
      btn.className = 'tahun-btn' + (nombor === dataPelajar.tahunDipilih ? ' active' : '');
      btn.textContent = '🎒 TAHUN ' + nombor;
      btn.onclick = function() { pilihTahun(nombor, btn); };
      container.appendChild(btn);
    })(i);
  }
}

// ==========================================
// PILIH TAHUN
// ==========================================
function pilihTahun(tahun, el) {
  var buttons = document.querySelectorAll('.tahun-btn');
  for (var i = 0; i < buttons.length; i++) buttons[i].classList.remove('active');
  el.classList.add('active');
  dataPelajar.tahunDipilih = tahun;
  simpanData();
  binaKotakSubjek(tahun);
}

// ==========================================
// BINA KOTAK SUBJEK
// ==========================================
function binaKotakSubjek(tahun) {
  var container = document.getElementById('kotakSubjek');
  var key = 'tahun' + tahun;
  var senarai = (DATA_SUBJEK && DATA_SUBJEK[key]) || [];
  
  container.innerHTML = '';
  
  for (var i = 0; i < senarai.length; i++) {
    var s = senarai[i];
    var a = document.createElement('a');
    a.href = 'subjek.html?tahun=' + tahun + '&id=' + s.id;
    a.className = 'subjek-kotak';
    a.style.borderColor = s.warna;
    
    var html = '';
    if (s.badge) {
      html += '<span class="badge-baru">' + s.badge + '</span>';
    }
    html += '<div class="emoji">' + s.emoji + '</div>';
    html += '<div class="nama" style="color:' + s.warna + '">' + s.nama + '</div>';
    html += '<div class="info">' + s.info + '</div>';
    
    a.innerHTML = html;
    container.appendChild(a);
  }
}

// ==========================================
// PANGKAT
// ==========================================
function updatePangkat() {
  var b = dataPelajar.bintang;
  var pangkat, emoji, warna;
  
  if (b >= 100) { pangkat = 'DIAMOND'; emoji = '💎'; warna = 'linear-gradient(135deg,#00CED1,#1E90FF)'; }
  else if (b >= 50) { pangkat = 'GOLD'; emoji = '🥇'; warna = 'linear-gradient(135deg,#D4AF37,#B8860B)'; }
  else if (b >= 20) { pangkat = 'SILVER'; emoji = '🥈'; warna = 'linear-gradient(135deg,#C0C0C0,#A9A9A9)'; }
  else { pangkat = 'BRONZE'; emoji = '🥉'; warna = 'linear-gradient(135deg,#CD7F32,#8B4513)'; }
  
  var el = document.getElementById('pangkatVIP');
  if (el) {
    el.textContent = emoji + ' ' + pangkat + ' MEMBER';
    el.style.background = warna;
  }
}

// ==========================================
// INIT
// ==========================================
async function init() {
  document.getElementById('namaPelajar').textContent = dataPelajar.nama;
  document.getElementById('namaMesej').textContent = dataPelajar.nama;
  updatePangkat();
  
  await muatData();
  
  binaButangTahun();
  binaKotakSubjek(dataPelajar.tahunDipilih);
}
